<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient View</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>Patient View</strong>
        <span>Your prior authorization record</span>
      </div>
      <nav class="nav">
        <a href="/doctor.html">Doctor</a>
        <a class="active" href="/patient.html">Patient</a>
        <a href="/insurance.html">Insurance</a>
      </nav>
    </header>
    <main class="wrap wide">
      <section class="card" id="login-card">
        <h1>Patient login</h1>
        <p class="meta">Enter your name and patient ID. You will only see your own record.</p>
        <form id="status-form">
          <label>
            Patient name
            <span class="hint">First and last name together, for example Jane Sample.</span>
            <input name="patientName" type="text" required maxlength="120" autocomplete="name" placeholder="Jane Sample" />
          </label>
          <label>
            Patient ID
            <span class="hint">Numeric patient ID or member ID, for example 1 or SAMP-0000123.</span>
            <input name="patientId" type="text" required maxlength="60" autocomplete="off" placeholder="1" />
          </label>
          <button class="btn patient" type="submit">Sign in</button>
        </form>
        <p id="message" class="alert hidden" role="status"></p>
      </section>

      <section id="dashboard" class="hidden" aria-live="polite"></section>
    </main>
    <script src="/patient.js"></script>
  </body>
</html>
